name: Build installers
run-name: Installers · ${{ github.ref_name }} · ${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            command: npm run dist
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - platform: mac-arm64
            os: macos-latest
            command: npm run dist:mac
            files: |
              release/*.dmg
              release/*.dmg.blockmap
              release/latest-mac.yml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:helper
      - run: npm test
      - name: Build installer
        run: ${{ matrix.command }}
      - name: Verify Mac app
        if: runner.os == 'macOS'
        run: |
          app="release/mac-arm64/lolPing.app"
          codesign --verify --deep --strict "$app"
          file "$app/Contents/Resources/hook-helper" | grep -q arm64
      - uses: actions/upload-artifact@v4
        with:
          name: lolPing-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
