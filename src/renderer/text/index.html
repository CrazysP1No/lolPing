<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>lolPing text</title>
    <link rel="stylesheet" href="./text.css" />
  </head>
  <body>
    <label id="title" for="message"></label>
    <input id="message" type="text" autocomplete="off" aria-describedby="hint count" autofocus />
    <p id="hint"></p>
    <footer>
      <span id="count" aria-live="polite">0 / 120</span>
      <button id="cancel" type="button"></button>
      <button id="send" type="button" disabled></button>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
